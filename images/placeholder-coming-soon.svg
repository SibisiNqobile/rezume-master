<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coming soon placeholder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f3f5"/>
      <stop offset="100%" stop-color="#dfe3e8"/>
    </linearGradient>
    <pattern id="diagonal-hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ced4da" stroke-width="6"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="800" height="450" rx="12" fill="url(#bg-grad)"/>

  <!-- subtle hazard-style corner hatch to signal "in progress" -->
  <rect x="0" y="0" width="800" height="450" rx="12" fill="url(#diagonal-hatch)" opacity="0.15"/>

  <!-- dashed border -->
  <rect x="10" y="10" width="780" height="430" rx="10" fill="none"
        stroke="#adb5bd" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- wrench + screwdriver icon, centered -->
  <g transform="translate(400,175)" stroke="#6c757d" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- screwdriver -->
    <line x1="-55" y1="45" x2="15" y2="-25"/>
    <rect x="12" y="-52" width="26" height="26" rx="4" transform="rotate(45 25 -39)" fill="#6c757d" stroke="none"/>
    <!-- wrench -->
    <line x1="55" y1="45" x2="-15" y2="-25"/>
    <path d="M -40 -50 a18 18 0 1 0 25 25 l -6 -6 -7 7 -6 -6 7 -7 z"
          fill="#6c757d" stroke="none"/>
  </g>

  <!-- text -->
  <text x="400" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#495057">
    Coming Soon
  </text>
  <text x="400" y="305" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="17" fill="#868e96">
    This section is a work in progress
  </text>
</svg>
